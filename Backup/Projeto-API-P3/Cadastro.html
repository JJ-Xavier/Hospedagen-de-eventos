<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Projeto API"> 
  <meta name="author" content="Jackson Junio Xavier Franco">    
  <title> Cadastro </title>
  <link rel="stylesheet" href="CSS/cadastro.css" />
</head>
<body>
  <div class="container">
    <div class="left-side">
      <h1>Já tem uma conta?</h1>
      <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quaerat dolorum, iste voluptatem, eos ducimus hic nam, quae debitis dicta ipsum odit! Inventore rem tempore sint consequatur quis deserunt, voluptates adipisci!</p>
      <a href="login.html" class="login-btn">Faça o login</a>
    </div>
    <div class="right-side">
      <h2> Cadastro </h2>
      <form id="form-cadastro">
        <input type="text" id="nome" placeholder="Nome" required />
        <input type="text" id="sobrenome" placeholder="Sobrenome" required />
        <input type="text" id="cpf" placeholder="CPF" required />
        <input type="email" id="email" placeholder="E-mail" required />
        <input type="password" id="senha" placeholder="Senha" required />
        <input type="password" id="confirmar-senha" placeholder="Confirmação de Senha" required />
        
        <button type="submit" class="cad-btn">Cadastrar</button>
      </form>

      <div id="mensagem"></div>

      <div class="divider">
        <span> ou </span>
      </div>

      <div class="socials">
        <button class="social-btn google">G</button>
        <button class="social-btn github">🐱‍💻</button>
      </div>
    </div>
  </div>
  <script src="JS/Cadastro.js"></script>
</body>
</html>
